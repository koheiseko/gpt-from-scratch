[project]
name = "gpt-from-scratch"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "tokenizers>=0.22.2",
    "torch>=2.10.0",
    "torchmetrics",
    "transformers>=5.1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ruff>=0.15.1",
]
